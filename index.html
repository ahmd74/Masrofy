<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<link rel="manifest" href="manifest.json">
<title>مصروفي | Masrofy</title>

<style>
:root{
  --bg:#f5f6fb;
  --card:#ffffff;
  --text:#171827;
  --muted:#77798b;
  --primary:#6d5dfc;
  --primary2:#8b7cff;
  --danger:#ef4444;
  --success:#16a34a;
  --border:#e8e8ef;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Tahoma",sans-serif;
}

.app{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:16px;
  padding-bottom:90px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.logo{
  font-size:25px;
  font-weight:900;
}

.logo span{
  color:var(--primary);
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:14px;
  background:var(--card);
  box-shadow:0 3px 12px #0000000d;
  font-size:20px;
}

.hero{
  background:linear-gradient(135deg,#6d5dfc,#8b7cff);
  color:white;
  border-radius:25px;
  padding:22px;
  box-shadow:0 12px 30px #6d5dfc30;
}

.hero-title{
  opacity:.85;
  font-size:14px;
}

.balance{
  font-size:36px;
  font-weight:900;
  margin:7px 0 18px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#ffffff20;
  border-radius:17px;
  padding:13px;
}

.stat small{
  opacity:.8;
}

.stat strong{
  display:block;
  margin-top:5px;
  font-size:18px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:18px;
  margin-top:16px;
  box-shadow:0 5px 18px #00000008;
}

.section-title{
  font-weight:900;
  font-size:18px;
  margin-bottom:14px;
}

.form-grid{
  display:grid;
  gap:11px;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid var(--border);
  background:#fafaff;
  color:var(--text);
  font-size:15px;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--primary);
}

.btn{
  border:0;
  border-radius:15px;
  padding:14px 17px;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-danger{
  background:#fee2e2;
  color:#b91c1c;
}

.btn-secondary{
  background:#f0efff;
  color:#5145cd;
}

.type-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.type-btn{
  padding:13px;
  border-radius:14px;
  border:1px solid var(--border);
  background:white;
  font-weight:800;
}

.type-btn.active-expense{
  background:#fff0f0;
  border-color:#ef4444;
  color:#dc2626;
}

.type-btn.active-income{
  background:#ecfdf3;
  border-color:#16a34a;
  color:#15803d;
}

.transactions{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.transaction{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border:1px solid var(--border);
  border-radius:17px;
}

.t-icon{
  width:45px;
  height:45px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f0efff;
  font-size:21px;
}

.t-info{
  flex:1;
}

.t-info strong{
  display:block;
  margin-bottom:4px;
}

.t-info small{
  color:var(--muted);
}

.amount{
  font-weight:900;
}

.amount.expense{
  color:#dc2626;
}

.amount.income{
  color:#16a34a;
}

.delete{
  border:0;
  background:none;
  color:#aaa;
  font-size:18px;
}

.categories{
  display:grid;
  gap:10px;
}

.category-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:15px;
}

.category-icon{
  font-size:22px;
}

.category-name{
  flex:1;
  font-weight:700;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:20px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#ffffffee;
  backdrop-filter:blur(15px);
  border-top:1px solid var(--border);
  padding:10px;
  display:flex;
  justify-content:center;
  z-index:10;
}

.nav-inner{
  width:100%;
  max-width:760px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.nav-btn{
  border:0;
  background:transparent;
  padding:10px;
  border-radius:14px;
  font-weight:800;
}

.nav-btn.active{
  background:#efedff;
  color:var(--primary);
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:30;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:760px;
  background:white;
  border-radius:25px 25px 0 0;
  padding:22px;
  max-height:85vh;
  overflow:auto;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.close{
  border:0;
  background:#f2f2f6;
  width:38px;
  height:38px;
  border-radius:12px;
  font-size:20px;
}

.add-category{
  display:grid;
  grid-template-columns:75px 1fr auto;
  gap:8px;
  margin-bottom:15px;
}

@media(max-width:420px){
  .app{
    padding:12px;
  }

  .balance{
    font-size:32px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">مصروفي <span>Masrofy</span></div>
    <button class="icon-btn" onclick="openCategories()">⚙️</button>
  </div>

  <section class="hero">
    <div class="hero-title">الرصيد الحالي</div>
    <div class="balance" id="balance">0.00 ج.م</div>

    <div class="stats">
      <div class="stat">
        <small>الدخل</small>
        <strong id="income">0.00 ج.م</strong>
      </div>

      <div class="stat">
        <small>المصروفات</small>
        <strong id="expense">0.00 ج.م</strong>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="section-title">إضافة حركة مالية</div>

    <div class="form-grid">

      <div class="type-buttons">
        <button
          id="expenseBtn"
          class="type-btn active-expense"
          onclick="setType('expense')">
          🔴 مصروف
        </button>

        <button
          id="incomeBtn"
          class="type-btn"
          onclick="setType('income')">
          🟢 دخل
        </button>
      </div>

      <input
        id="amount"
        type="number"
        inputmode="decimal"
        placeholder="المبلغ">

      <input
        id="note"
        type="text"
        placeholder="وصف العملية">

      <select id="category"></select>

      <input
        id="date"
        type="date">

      <button class="btn btn-primary" onclick="addTransaction()">
        + إضافة العملية
      </button>

    </div>
  </section>

  <section class="card">
    <div class="section-title">آخر العمليات</div>

    <div id="transactions" class="transactions"></div>
  </section>

</div>

<div class="bottom-nav">
  <div class="nav-inner">

    <button class="nav-btn active">
      🏠<br>
      الرئيسية
    </button>

    <button class="nav-btn" onclick="scrollToTransactions()">
      📋<br>
      العمليات
    </button>

    <button class="nav-btn" onclick="openCategories()">
      ⚙️<br>
      التخصيص
    </button>

  </div>
</div>


<!-- Categories Modal -->

<div id="categoryModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">
      <strong>تخصيص الأقسام</strong>

      <button
        class="close"
        onclick="closeCategories()">
        ×
      </button>
    </div>

    <div class="add-category">

      <input
        id="newIcon"
        value="📌"
        maxlength="3">

      <input
        id="newCategory"
        placeholder="اسم القسم الجديد">

      <button
        class="btn btn-primary"
        onclick="addCategory()">
        إضافة
      </button>

    </div>

    <div id="categoryList" class="categories"></div>

  </div>

</div>


<script>

let transactionType = "expense";

const defaultCategories = [

  {id:"food",name:"أكل ومشروبات",icon:"🍔"},
  {id:"transport",name:"مواصلات",icon:"🚗"},
  {id:"home",name:"منزل",icon:"🏠"},
  {id:"shopping",name:"مشتريات",icon:"🛒"},
  {id:"bills",name:"فواتير",icon:"💡"},
  {id:"health",name:"صحة",icon:"💊"},
  {id:"entertainment",name:"ترفيه",icon:"🎬"},
  {id:"education",name:"تعليم",icon:"📚"},
  {id:"work",name:"عمل",icon:"💼"},
  {id:"subscriptions",name:"اشتراكات",icon:"📱"},
  {id:"travel",name:"سفر",icon:"✈️"},
  {id:"gifts",name:"هدايا",icon:"🎁"},
  {id:"other",name:"أخرى",icon:"📦"}

];

let categories =
  JSON.parse(localStorage.getItem("masrofy_categories"))
  || defaultCategories;

let transactions =
  JSON.parse(localStorage.getItem("masrofy_transactions"))
  || [];


document.getElementById("date").value =
  new Date().toISOString().split("T")[0];


function save(){

  localStorage.setItem(
    "masrofy_categories",
    JSON.stringify(categories)
  );

  localStorage.setItem(
    "masrofy_transactions",
    JSON.stringify(transactions)
  );

}


function setType
